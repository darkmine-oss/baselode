[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "baselode"
dynamic = ["version"]
description = "Domain-aware data models and utilities for exploration and mining datasets."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Tamara Vasey" }]
maintainers = [{ name = "Darkmine Pty Ltd" }]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]


dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "plotly>=5.0",
    "geopandas>=0.13",
    "pyproj>=3.4",
  "pyarrow>=12.0",
]

[project.optional-dependencies]
scalable = ["simpeg==0.26.0; python_version >= '3.12'", "discretize==0.13.0; python_version >= '3.12'", "geoana==0.9.0; python_version >= '3.12'", "choclo==0.3.2", "scipy==1.15.3; python_version < '3.11'", "scipy==1.17.1; python_version >= '3.11'"]
inversion = ["harmonica==0.7.0", "choclo==0.3.2", "scipy==1.15.3; python_version < '3.11'", "scipy==1.17.1; python_version >= '3.11'"]
viz = ["folium>=0.15"]
sql = ["sqlalchemy>=2.0"]
las = ["lasio>=0.31"]
raster = ["rasterio>=1.4"]
api = ["requests>=2.28"]
omf = ["omf>=1.0,<2.0"]
magnetics = ["ppigrf==2.1.0"]
gravity = ["boule==0.6.0"]
potential-fields = ["harmonica==0.7.0", "choclo==0.3.2"]
test = ["pytest>=8", "jsonschema>=4.18", "mpmath==1.3.0"]
all = ["folium>=0.15", "sqlalchemy>=2.0", "lasio>=0.31", "rasterio>=1.4", "requests>=2.28", "omf>=1.0,<2.0", "harmonica==0.7.0", "choclo==0.3.2", "ppigrf==2.1.0", "boule==0.6.0", "scipy==1.15.3; python_version < '3.11'", "scipy==1.17.1; python_version >= '3.11'", "simpeg==0.26.0; python_version >= '3.12'", "discretize==0.13.0; python_version >= '3.12'", "geoana==0.9.0; python_version >= '3.12'"]

[tool.pytest.ini_options]
# Run from python/: `pytest`. `pythonpath` lets tests import baselode from src
# without an editable install.
pythonpath = ["src"]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/darkmine-oss/baselode"
Repository = "https://github.com/darkmine-oss/baselode"
Issues = "https://github.com/darkmine-oss/baselode/issues"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["build", "build.*", "*.egg-info", "*.egg-info.*"]

[tool.setuptools_scm]
root = ".."
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.setuptools.package-data]
"baselode.geophysics" = ["*.json"]
