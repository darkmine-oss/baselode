name: CI

on:
  pull_request:
  workflow_dispatch:

# To make this a required check on PRs, go to
# Settings → Branches → Branch protection rules → main and add the
# "Python tests" and "JavaScript tests" status checks below
# "Require status checks to pass before merging".

jobs:
  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt
          pip install pytest
          # Install optional extras so tests covering them actually run
          # in CI instead of skipping silently.
          pip install "omf>=1.0,<2.0" "lasio>=0.31"

      - name: Run tests
        run: python -m pytest test -q

  test-js:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: javascript/packages/baselode
        run: npm ci

      - name: Run tests
        working-directory: javascript/packages/baselode
        run: npm test

  test-strip-log-gallery:
    name: Strip-log visual coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install demo dependencies
        working-directory: demo-viewer-react/app
        run: npm ci

      - name: Install Chromium
        working-directory: demo-viewer-react/app
        run: npx playwright install --with-deps chromium

      # Pixel baselines are reviewed and updated explicitly on a consistent
      # workstation. CI verifies manifest coverage, nonblank plots, clipping,
      # and responsive containment without introducing cross-OS font noise.
      - name: Verify desktop and mobile gallery coverage
        working-directory: demo-viewer-react/app
        run: npm run test:visual:smoke

      - name: Build generated documentation
        run: |
          npm ci --prefix docs
          npm run docs:striplogs --prefix demo-viewer-react/app
          git diff --exit-code -- docs/strip-log-gallery.md
          npm run build --prefix docs

  build-python:
    name: Build Python package
    needs: test-python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build distribution
        working-directory: python
        run: python -m build

      - name: Check distribution
        working-directory: python
        run: python -m twine check dist/*

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/

  build-npm:
    name: Build JavaScript package
    needs: test-js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: javascript/packages/baselode
        run: npm ci

      - name: Build package
        working-directory: javascript/packages/baselode
        run: npm run build

      - name: Upload npm artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: javascript/packages/baselode/dist/
